<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天赋深度报告 | 你天生擅长什么</title>
<style>
  :root{
    --bg:#f7f6f3;
    --card:#ffffff;
    --text:#1c1917;
    --muted:#78716c;
    --line:#e7e5e4;
    --warm:#f59e0b;
    --warm-d:#d97706;
    --shadow:0 1px 2px rgba(28,25,23,.04), 0 14px 36px -14px rgba(28,25,23,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 520px at 6% -14%, rgba(245,158,11,.14), transparent 60%),
      radial-gradient(820px 520px at 100% 0%, rgba(236,72,153,.09), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    line-height:1.65;
  }

  /* ---------- 导航 ---------- */
  .nav{
    max-width:1120px;margin:0 auto;padding:22px 20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:.2px}
  .logo-mark{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,#f59e0b,#f97316 60%,#ec4899);
    color:#fff;font-size:16px;font-weight:800;
    box-shadow:0 6px 18px -6px rgba(245,158,11,.8);
  }
  .nav-tag{
    font-size:12.5px;color:var(--muted);border:1px solid var(--line);
    background:rgba(255,255,255,.75);padding:5px 12px;border-radius:999px;
  }

  /* ---------- 布局 ---------- */
  main{max-width:1120px;margin:0 auto;padding:8px 20px 60px}
  .screen{display:none}
  .screen.active{display:block;animation:fadeUp .5s cubic-bezier(.22,1,.36,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:26px 26px;box-shadow:var(--shadow);
  }
  .card h3{font-size:15px;font-weight:800;letter-spacing:.2px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
  .card h3::before{content:"";width:4px;height:15px;border-radius:2px;background:linear-gradient(180deg,#f59e0b,#ec4899)}

  /* ---------- 首页 ---------- */
  .hero{text-align:center;padding:40px 0 46px}
  .badge{
    display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:1.4px;
    color:var(--warm-d);background:rgba(245,158,11,.12);
    padding:7px 16px;border-radius:999px;margin-bottom:22px;
  }
  .hero h1{
    font-size:clamp(30px,5.4vw,50px);line-height:1.2;font-weight:800;letter-spacing:-.5px;
    margin-bottom:18px;
  }
  .grad{
    background:linear-gradient(120deg,#f59e0b,#f97316 45%,#ec4899);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p.lead{
    max-width:580px;margin:0 auto 32px;color:var(--muted);font-size:16.5px;line-height:1.85;
  }
  .btn-primary{
    border:none;cursor:pointer;font-family:inherit;
    padding:16px 46px;border-radius:999px;
    background:linear-gradient(135deg,#f59e0b,#f97316 52%,#ec4899);
    background-size:180% 180%;
    color:#fff;font-size:17px;font-weight:800;letter-spacing:.3px;
    box-shadow:0 14px 34px -12px rgba(245,158,11,.85);
    transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s, background-position .5s;
  }
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 44px -12px rgba(245,158,11,.9);background-position:100% 50%}
  .btn-primary:active{transform:translateY(-1px)}
  .hint{font-size:13px;color:#a8a29e;margin-top:16px}

  .dim-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;
  }
  .dim-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px 18px;box-shadow:0 1px 2px rgba(28,25,23,.03);
    transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s;
  }
  .dim-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .dim-icon{font-size:22px;margin-bottom:8px}
  .dim-name{font-weight:800;font-size:15px;margin-bottom:4px}
  .dim-name small{font-weight:700;font-size:11.5px;letter-spacing:.6px;margin-left:5px;opacity:.75}
  .dim-tag{font-size:11.5px;font-weight:700;color:var(--warm-d);margin-bottom:8px;letter-spacing:.3px}
  .dim-desc{font-size:12.8px;color:var(--muted);line-height:1.6}

  /* ---------- 测试页 ---------- */
  .quiz-wrap{max-width:740px;margin:0 auto;padding-top:10px}
  .quiz-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .quiz-top .idx{font-size:13.5px;color:var(--muted);font-weight:600}
  .quiz-top .idx b{color:var(--text);font-size:17px}
  .quiz-top .pct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .progress{height:7px;background:#eae7e3;border-radius:999px;overflow:hidden;margin-bottom:34px}
  .progress-bar{
    height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#f59e0b,#f97316 60%,#ec4899);
    transition:width .45s cubic-bezier(.22,1,.36,1);
  }
  .q-card{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:36px 32px 30px;box-shadow:var(--shadow);margin-bottom:22px;
  }
  .q-text{
    font-size:clamp(19px,2.6vw,23px);font-weight:800;line-height:1.55;
    letter-spacing:-.2px;margin-bottom:28px;min-height:72px;
    animation:qIn .35s cubic-bezier(.22,1,.36,1);
  }
  @keyframes qIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .options{display:flex;flex-direction:column;gap:11px}
  .opt{
    display:flex;align-items:center;gap:15px;width:100%;text-align:left;
    padding:15px 20px;border-radius:14px;cursor:pointer;
    background:#fff;border:1.5px solid var(--line);
    font-family:inherit;font-size:15.5px;color:var(--text);
    transition:border-color .18s, background .18s, transform .18s, box-shadow .18s;
  }
  .opt:hover{border-color:#fcd9a4;background:#fffdf8;transform:translateX(4px)}
  .opt .dot{
    width:19px;height:19px;border-radius:50%;flex:none;
    border:2px solid #d6d3d1;transition:.18s;
  }
  .opt .lbl{flex:1;font-weight:700}
  .opt .sub{font-size:12.5px;color:#a8a29e;font-weight:400;display:block;line-height:1.4}
  .opt.selected{border-color:var(--warm);background:#fff8ec;box-shadow:0 0 0 3px rgba(245,158,11,.14)}
  .opt.selected .dot{border-color:var(--warm);background:var(--warm);box-shadow:inset 0 0 0 3.5px #fff}

  .quiz-nav{display:flex;justify-content:space-between;gap:12px}
  .btn-ghost{
    font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
    padding:12px 26px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;color:var(--muted);transition:.2s;
  }
  .btn-ghost:hover:not(:disabled){border-color:#fcd9a4;color:var(--warm-d);background:#fffdf8}
  .btn-ghost:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost.primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,#f59e0b,#f97316)}
  .btn-ghost.primary:hover{filter:brightness(1.07)}

  /* =========================================================
     报告页
     ========================================================= */
  .report-header{
    background:linear-gradient(135deg,#292524 0%,#3f2d1a 55%,#5a3616 100%);
    border-radius:26px;
    padding:42px 40px 38px;
    color:#fff;
    margin-bottom:30px;
    position:relative;
    overflow:hidden;
    box-shadow:0 24px 60px -24px rgba(90,54,22,.6);
  }
  .report-header::before{
    content:'';
    position:absolute;top:-120px;right:-100px;width:420px;height:420px;
    background:radial-gradient(circle,rgba(245,158,11,.45),transparent 68%);
    border-radius:50%;pointer-events:none;
  }
  .report-header::after{
    content:'';
    position:absolute;bottom:-160px;left:-80px;width:380px;height:380px;
    background:radial-gradient(circle,rgba(236,72,153,.25),transparent 70%);
    border-radius:50%;pointer-events:none;
  }
  .rh-top{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    margin-bottom:30px;position:relative;z-index:1;
  }
  .rh-label{
    font-size:11px;font-weight:800;letter-spacing:3px;
    color:rgba(255,255,255,.6);
  }
  .rh-meta{
    font-size:11.5px;color:rgba(255,255,255,.42);letter-spacing:.5px;
    font-variant-numeric:tabular-nums;
  }
  .rh-code{
    font-size:clamp(52px,11vw,86px);font-weight:800;
    letter-spacing:.16em;line-height:1;padding-left:.16em;
    background:linear-gradient(120deg,#fff,#fcd9a4 42%,#f9a8d4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:14px;position:relative;z-index:1;
  }
  .rh-names{
    font-size:15.5px;font-weight:700;color:rgba(255,255,255,.8);
    letter-spacing:.5px;margin-bottom:22px;position:relative;z-index:1;
  }
  .rh-names span{color:#fff;font-weight:800}
  .rh-names i{font-style:normal;opacity:.35;margin:0 8px}
  .rh-summary{
    font-size:15px;line-height:1.9;color:rgba(255,255,255,.78);
    max-width:780px;position:relative;z-index:1;
    padding-top:22px;border-top:1px solid rgba(255,255,255,.13);
  }
  .rh-summary b{color:#fff;font-weight:800}

  /* 章节标题 */
  .chapter{
    display:flex;align-items:center;gap:14px;
    margin:46px 0 20px;
  }
  .chapter:first-of-type{margin-top:0}
  .chapter-num{
    font-size:10.5px;font-weight:800;letter-spacing:1.8px;
    color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316);
    padding:6px 11px;border-radius:8px;white-space:nowrap;
  }
  .chapter-title{
    font-size:19px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;
  }
  .chapter-line{
    flex:1;height:1px;
    background:linear-gradient(90deg,var(--line),transparent);
  }

  /* 可视化双栏 */
  .viz-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}

  .radar{width:100%;height:auto;display:block}
  .radar-shape{transform-origin:210px 210px;animation:pop .9s cubic-bezier(.34,1.4,.64,1) both}
  @keyframes pop{from{transform:scale(.05);opacity:0}to{transform:scale(1);opacity:1}}

  .bar-row{display:grid;grid-template-columns:150px 1fr 50px;align-items:center;gap:12px;margin-bottom:16px}
  .bar-row:last-child{margin-bottom:0}
  .bar-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;white-space:nowrap}
  .bar-label i{width:9px;height:9px;border-radius:50%;flex:none}
  .bar-track{height:9px;background:#eae7e3;border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;width:0;border-radius:999px;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
  .bar-val{font-size:13px;font-weight:800;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

  .score-note{
    margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);
    font-size:12.8px;color:var(--muted);line-height:1.8;
  }
  .score-note b{color:var(--text)}

  /* 天赋速写 */
  .persona{
    background:linear-gradient(135deg,#fffdf8,#fef7ec);
    border:1px solid #f7e3c2;border-radius:18px;
    padding:28px 30px;
    font-size:15.5px;line-height:2;color:#44403c;
  }
  .persona b{color:var(--warm-d);font-weight:800}
  .persona .hl{
    background:linear-gradient(180deg,transparent 60%,rgba(245,158,11,.28) 60%);
    font-weight:800;color:var(--text);padding:0 2px;
  }
  .persona .quote{
    display:block;margin:18px 0;padding:16px 22px;
    background:#fff;border-left:4px solid var(--warm);border-radius:0 12px 12px 0;
    font-size:16px;font-weight:700;color:var(--warm-d);line-height:1.8;
  }

  /* 天赋卡 */
  .type-profile{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:26px 26px 24px;margin-bottom:18px;
    box-shadow:0 1px 3px rgba(28,25,23,.03);
    position:relative;overflow:hidden;
  }
  .type-profile::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:var(--tc);
  }
  .tp-head{display:flex;align-items:flex-start;gap:15px;margin-bottom:16px}
  .tp-rank{
    width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;
    font-weight:800;font-size:16px;color:#fff;letter-spacing:-.5px;
  }
  .tp-title{flex:1}
  .tp-title h3{
    font-size:19px;font-weight:800;letter-spacing:-.2px;
    display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  }
  .tp-title h3 small{
    font-size:11px;font-weight:700;letter-spacing:1px;
    color:#a8a29e;text-transform:uppercase;
  }
  .tp-traits{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .trait{
    font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;
    background:#f5f4f2;color:#78716c;
  }
  .tp-score{text-align:right;flex:none}
  .tp-score b{
    display:block;font-size:26px;font-weight:800;line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .tp-score small{font-size:10.5px;color:#a8a29e;letter-spacing:1px;font-weight:700}
  .tp-desc{
    font-size:14.5px;line-height:1.9;color:#57534e;margin-bottom:18px;
    background:#fafaf9;border-left:3px solid var(--tc);border-radius:0 12px 12px 0;
    padding:14px 18px;
  }
  .tp-desc b{color:var(--text);font-weight:800}
  .tp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tp-block{
    background:#fafaf9;border:1px solid #f0eeec;border-radius:14px;
    padding:16px 18px;
  }
  .tp-block h4{
    font-size:12.5px;font-weight:800;letter-spacing:.8px;
    margin-bottom:11px;display:flex;align-items:center;gap:6px;
  }
  .tp-block ul{list-style:none}
  .tp-block li{
    font-size:13px;color:#57534e;line-height:1.75;
    padding-left:15px;position:relative;margin-bottom:6px;
  }
  .tp-block li:last-child{margin-bottom:0}
  .tp-block li::before{
    content:'';position:absolute;left:2px;top:9px;
    width:5px;height:5px;border-radius:50%;background:#d6d3d1;
  }
  .tp-block.strength h4{color:#059669}
  .tp-block.strength li::before{background:#6ee7b7}
  .tp-block.blind h4{color:#d97706}
  .tp-block.blind li::before{background:#fcd34d}
  .tp-env{
    margin-top:14px;padding:13px 18px;border-radius:13px;
    background:#fef7ec;font-size:13.5px;color:#57534e;line-height:1.75;
    display:flex;gap:10px;align-items:flex-start;
    border:1px solid #f7e3c2;
  }
  .tp-env span:first-child{flex:none;font-size:14px}

  /* 维度分数详细解读 */
  .score-detail{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:24px 26px;margin-bottom:18px;
    box-shadow:0 1px 3px rgba(28,25,23,.03);
  }
  .score-detail h4{
    font-size:14px;font-weight:800;margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .sd-item{
    display:flex;gap:14px;align-items:flex-start;
    padding:12px 0;border-bottom:1px dashed #f0eeec;
  }
  .sd-item:last-child{border-bottom:none;padding-bottom:0}
  .sd-item:first-of-type{padding-top:0}
  .sd-code{
    width:32px;height:32px;flex:none;border-radius:10px;
    display:grid;place-items:center;font-size:13px;font-weight:800;
    color:#fff;margin-top:1px;
  }
  .sd-body{flex:1}
  .sd-body strong{
    font-size:13.5px;font-weight:800;display:block;margin-bottom:3px;
  }
  .sd-body p{font-size:13px;color:var(--muted);line-height:1.75}
  .sd-body p b{color:var(--text);font-weight:800}
  .sd-score{
    font-size:13px;font-weight:800;flex:none;
    font-variant-numeric:tabular-nums;
  }

  /* 组合解读 */
  .combo-box{
    background:linear-gradient(135deg,#3f2d1a,#5a3616);
    border-radius:18px;padding:30px 32px;color:#fff;
    position:relative;overflow:hidden;
    box-shadow:0 18px 44px -22px rgba(90,54,22,.65);
    margin-bottom:18px;
  }
  .combo-box::before{
    content:'';position:absolute;top:-80px;right:-60px;width:280px;height:280px;
    background:radial-gradient(circle,rgba(245,158,11,.4),transparent 70%);
    border-radius:50%;
  }
  .combo-tag{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:2px;
    color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.22);
    padding:5px 12px;border-radius:999px;margin-bottom:16px;
    position:relative;z-index:1;
  }
  .combo-box h3{
    font-size:20px;font-weight:800;margin-bottom:14px;letter-spacing:-.2px;
    position:relative;z-index:1;
  }
  .combo-box p{
    font-size:14.5px;line-height:2;color:rgba(255,255,255,.82);
    position:relative;z-index:1;
  }
  .combo-box p b{color:#fff;font-weight:800}
  .combo-box p + p{margin-top:12px}

  /* 生活场景 */
  .scene-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .scene-block{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:24px 24px 22px;position:relative;overflow:hidden;
  }
  .scene-block::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--sc);
  }
  .scene-icon{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    font-size:18px;margin-bottom:14px;
    background:linear-gradient(135deg,#fff8ec,#fef3e2);
  }
  .scene-block h4{font-size:15px;font-weight:800;margin-bottom:10px;letter-spacing:-.1px}
  .scene-block p{font-size:13.5px;color:#57534e;line-height:1.85}
  .scene-block p + p{margin-top:9px}
  .scene-block p b{color:var(--text);font-weight:800}
  .scene-block .hl{
    background:linear-gradient(180deg,transparent 60%,rgba(245,158,11,.22) 60%);
    font-weight:700;padding:0 2px;
  }

  /* 别人眼中的你 */
  .mirror-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .mirror-block{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:24px 24px 22px;position:relative;overflow:hidden;
  }
  .mirror-block::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--mc);
  }
  .mirror-label{
    font-size:11px;font-weight:800;letter-spacing:1.8px;
    margin-bottom:12px;display:flex;align-items:center;gap:8px;
  }
  .mirror-label span{
    width:22px;height:22px;border-radius:8px;display:grid;place-items:center;
    font-size:12px;color:#fff;background:var(--mc);
  }
  .mirror-block h4{font-size:15.5px;font-weight:800;margin-bottom:11px;letter-spacing:-.1px}
  .mirror-block p{font-size:13.8px;color:#57534e;line-height:1.85}
  .mirror-block p + p{margin-top:9px}
  .mirror-block .truth{
    margin-top:12px;padding:12px 16px;border-radius:11px;
    background:#fef7ec;font-size:13.2px;color:var(--warm-d);
    font-weight:700;line-height:1.75;border:1px solid #f7e3c2;
  }

  /* 大实话 */
  .truth-list{display:flex;flex-direction:column;gap:12px}
  .truth-item{
    display:flex;gap:14px;align-items:flex-start;
    background:#fff;border:1px solid var(--line);border-radius:15px;
    padding:19px 21px;
    box-shadow:0 1px 2px rgba(28,25,23,.03);
  }
  .truth-num{
    width:26px;height:26px;flex:none;border-radius:9px;
    display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#f59e0b,#f97316);
    margin-top:1px;
  }
  .truth-item p{font-size:14.2px;color:#44403c;line-height:1.8}
  .truth-item p b{color:var(--text);font-weight:800}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* =========================================================
   9. 测试流程
   ========================================================= */
function startQuiz(){
  QUESTIONS = shuffle(RAW_QUESTIONS);
  answers = new Array(TOTAL).fill(null);
  current = 0;
  clearTimeout(advanceTimer);
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[current];
  $('qNow').textContent = current + 1;
  const answered = answers.filter(v => v !== null).length;
  const pct = Math.round(answered / TOTAL * 100);
  $('qPct').textContent = pct + '%';
  $('progressBar').style.width = pct + '%';

  const textEl = $('qText');
  textEl.textContent = q.t;
  textEl.style.animation = 'none';
  void textEl.offsetWidth;
  textEl.style.animation = '';

  $('options').innerHTML = OPTIONS.map(o => `
    <button class="opt${answers[current] === o.v ? ' selected' : ''}" data-v="${o.v}" onclick="choose(${o.v})">
      <span class="dot"></span>
      <span class="lbl">${o.label}<span class="sub">${o.sub}</span></span>
    </button>`).join('');

  $('prevBtn').disabled = current === 0;
  updateNextBtn();
}

function updateNextBtn(){
  const btn = $('nextBtn');
  const isLast = current === TOTAL - 1;
  btn.textContent = isLast ? '看结果 →' : '下一题 →';
  btn.disabled = answers[current] === null;
  btn.style.opacity = answers[current] === null ? .45 : 1;
  btn.style.cursor = answers[current] === null ? 'not-allowed' : 'pointer';
}

function choose(v){
  answers[current] = v;
  document.querySelectorAll('.opt').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.v) === v);
  });
  updateNextBtn();

  const answered = answers.filter(x => x !== null).length;
  const pct = Math.round(answered / TOTAL * 100);
  $('qPct').textContent = pct + '%';
  $('progressBar').style.width = pct + '%';

  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => {
    if(current < TOTAL - 1) { current++; renderQuestion(); }
    else { showResult(); }
  }, 300);
}

function goPrev(){
  clearTimeout(advanceTimer);
  if(current > 0){ current--; renderQuestion(); }
}

function goNext(){
  clearTimeout(advanceTimer);
  if(answers[current] === null) return;
  if(current < TOTAL - 1){ current++; renderQuestion(); }
  else { showResult(); }
}

   10. 计分
   ========================================================= */
function computeResult(){
  const raw = {R:0,I:0,A:0,S:0,E:0,C:0};
  const cnt = {R:0,I:0,A:0,S:0,E:0,C:0};
  QUESTIONS.forEach((q,i) => {
    const v = answers[i] ?? 3;
    raw[q.d] += v;
    cnt[q.d] += 1;
  });
  const pct = {};
  ORDER.forEach(d => {
    const min = cnt[d] * 1, max = cnt[d] * 5;
    pct[d] = Math.round((raw[d] - min) / (max - min) * 100);
  });
  return pct;
}

function radarSVG(pct){
  const cx = 210, cy = 210, maxR = 130;
  const ang = i => -Math.PI/2 + i * Math.PI/3;
  const pt = (i,r) => [cx + r*Math.cos(ang(i)), cy + r*Math.sin(ang(i))];
  let s = '';

  for(let l=5;l>=1;l--){
    const r = maxR * l / 5;
    const pts = ORDER.map((_,i) => pt(i,r).join(',')).join(' ');
    s += `<polygon points="${pts}" fill="${l%2 ? '#ffffff' : '#fafaf9'}" stroke="#e7e5e4" stroke-width="1"/>`;
  }
  ORDER.forEach((_,i) => {
    const [x,y] = pt(i,maxR);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e7e5e4" stroke-width="1"/>`;
  });

  const dataPts = ORDER.map((d,i) => {
    const r = maxR * (0.10 + 0.90 * pct[d] / 100);
    return pt(i,r).join(',');
  }).join(' ');
  s += `<polygon class="radar-shape" points="${dataPts}" fill="rgba(245,158,11,.22)" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>`;

  ORDER.forEach((d,i) => {
    const r = maxR * (0.10 + 0.90 * pct[d] / 100);
    const [x,y] = pt(i,r);
    s += `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="${DIMS[d].color}" stroke-width="2.5"/>`;
  });

  ORDER.forEach((d,i) => {
    const [x,y] = pt(i, maxR + 34);
    s += `<text x="${x}" y="${y - 7}" text-anchor="middle" dominant-baseline="middle"
            font-size="14" font-weight="800" fill="${DIMS[d].color}"
            font-family="-apple-system,Segoe UI,PingFang SC,sans-serif">${DIMS[d].name}</text>`;
    s += `<text x="${x}" y="${y + 11}" text-anchor="middle" dominant-baseline="middle"
            font-size="11.5" fill="#a8a29e"
            font-family="-apple-system,Segoe UI,PingFang SC,sans-serif">${pct[d]}%</text>`;
  });

  return `<svg viewBox="0 0 420 420" class="radar" role="img" aria-label="六维天赋雷达图">${s}</svg>`;
}

/* =========================================================
   12. 生成报告
   ========================================================= */
function showResult(){
  clearTimeout(advanceTimer);
  const pct = computeResult();
  const sorted = ORDER.slice().sort((a,b) => pct[b] - pct[a]);
  const top3 = sorted.slice(0,3);
  const [t1,t2,t3] = top3;

  /* --- 基本信息 --- */
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const reportNo = 'TN-' + now.getFullYear() +
                   String(now.getMonth()+1).padStart(2,'0') +
                   String(now.getDate()).padStart(2,'0') + '-' +
                   Math.random().toString(36).slice(2,6).toUpperCase();

  /* --- 组合 --- */
  const comboKey = [t1,t2].sort().join('');
  const combo = COMBO[comboKey] || {title:'多面手型', txt:'你的天赋分布比较平均，没有哪一项压倒性突出。这不是坏事——说明你在很多场景里都能适应，不容易被"框"住。你适合在需要同时用到多种能力的位置上，比如跨部门协作、复合型岗位、或者自己攒一个盘子。', scene:'你的优势不在某一项特别强，而在于"什么都能来一点"。这种人在团队里，往往是最灵活的那一个。'};

  const gap = pct[t1] - pct[t2];
  const dualCore = gap < 8;

  /* --- 报告头 --- */
  const summaryShort =
    `你最有天赋的是 <b>${DIMS[t1].name}</b>` +
    (dualCore ? `，而且 <b>${DIMS[t2].name}</b> 跟它几乎一样强，你属于"双天赋"的人` : `，<b>${DIMS[t2].name}</b> 是你的第二天赋`) +
    `，<b>${DIMS[t3].name}</b> 排在第三。`;

  /* --- 天赋速写 --- */
  const persona =
    `说白了，你是一个<span class="hl">${DIMS[t1].name}</span>的人——` +
    `<span class="quote">"${TALENT[t1].bigTruth}"</span>` +
    `你的第二天赋是<b>${DIMS[t2].name}</b>，${TALENT[t2].bigTruth.replace('你这种人，','')}` +
    `再加上<b>${DIMS[t3].name}</b>的底色，你身上其实同时住着三种能力。` +
    (dualCore
      ? `<br><br>注意，你的前两项分数非常接近（只差 ${gap} 分），说明你不是单一类型的人，而是<b>双天赋并重</b>。这种人在职场里其实很吃香——因为你比别人多一个视角，遇到复杂问题更容易找到突破口。`
      : `<br><br>你的天赋结构很清晰：<b>${DIMS[t1].name}</b>是主心骨，<b>${DIMS[t2].name}</b>在关键时刻帮你补位。这两个加在一起，就是你的核心竞争力。`) +
    `<br><br>别再盯着自己的短板看了。真正让你走得远的，从来不是你补了多少短板，而是你把长板用到了什么程度。`;

  /* --- 天赋卡（详细版） --- */
  const typeCards = top3.map((d, idx) => {
    const m = DIMS[d];
    const t = TALENT[d];
    const band = scoreBand(pct[d]);
    return `
      <div class="type-profile" style="--tc:${m.color}">
        <div class="tp-head">
          <div class="tp-rank" style="background:linear-gradient(135deg,${m.color},${m.color}bb)">${idx+1}</div>
          <div class="tp-title">
            <h3 style="color:${m.color}">${m.name}<small>${d} · ${m.en}</small></h3>
            <div class="tp-traits">${t.traits.map(x=>`<span class="trait">${x}</span>`).join('')}</div>
          </div>
          <div class="tp-score">
            <b style="color:${m.color}">${pct[d]}<span style="font-size:15px">%</span></b>
            <small style="color:${band.color}">${band.txt}</small>
          </div>
        </div>
        <p class="tp-desc">${t.scene}</p>
        <div class="tp-grid">
          <div class="tp-block strength">
            <h4>✦ 你天生擅长</h4>
            <ul>${t.strengths.map(x=>`<li>${x}</li>`).join('')}</ul>
          </div>
          <div class="tp-block blind">
            <h4>△ 要留意的地方</h4>
            <ul>${t.blindspots.map(x=>`<li>${x}</li>`).join('')}</ul>

        </div>
        <div class="tp-env">
          <span>🏠</span>
          <span><b>什么样的环境最适合你：</b>${t.env}</span>
        </div>
      </div>`;

  /* --- 六维详细解读 --- */
  const scoreDetailHTML = ORDER.map(d => {
    const m = DIMS[d];
    const v = pct[d];
    const band = scoreBand(v);
    return `
      <div class="sd-item">
        <div class="sd-code" style="background:${m.color}">${d}</div>
        <div class="sd-body">
          <strong style="color:${m.color}">${m.name} · ${m.tag}</strong>

  /* --- 分数条 --- */
  const barRows = ORDER.map(d => `

  /* --- 生活场景 --- */
  const sceneHTML = `
    <div class="scene-grid">
      <div class="scene-block" style="--sc:${DIMS[t1].color}">
        <div class="scene-icon">💼</div>
        <h4>工作中的你</h4>
        <p>${TALENT[t1].workStyle}</p>
        <p>${TALENT[t2].workStyle}</p>
      </div>
      <div class="scene-block" style="--sc:${DIMS[t2].color}">
        <div class="scene-icon">📚</div>
        <h4>学习中的你</h4>
        <p>${TALENT[t1].learning}</p>
        <p>${TALENT[t2].learning}</p>
      </div>
      <div class="scene-block" style="--sc:${DIMS[t3].color}">
        <div class="scene-icon">👥</div>
        <h4>团队中的你</h4>
        <p>${TALENT[t1].teamRole}</p>
        <p>${TALENT[t2].teamRole}</p>
      </div>
      <div class="scene-block" style="--sc:#f59e0b">
        <div class="scene-icon">🌊</div>
        <h4>压力下的你</h4>
        <p>${TALENT[t1].stress}</p>
        <p>${TALENT[t2].stress}</p>
      </div>
    </div>`;

  /* --- 别人眼中的你 --- */
  const mirrorHTML = `
    <div class="mirror-grid">
      <div class="mirror-block" style="--mc:${DIMS[t1].color}">
        <div class="mirror-label" style="color:${DIMS[t1].color}"><span>?</span>别人常常这样误解你</div>
        <h4>${TALENT[t1].misread}</h4>
        <p>${TALENT[t1].misreadTruth}</p>
        <div class="truth">这不是你的问题，只是你和他们的"频道"不一样。懂你的人，不用解释；不懂的人，解释也没用。</div>
      </div>
      <div class="mirror-block" style="--mc:${DIMS[t2].color}">
        <div class="mirror-label" style="color:${DIMS[t2].color}"><span>?</span>关于第二天赋</div>
        <h4>${TALENT[t2].misread}</h4>
        <p>${TALENT[t2].misreadTruth}</p>
        <div class="truth">这是你的隐藏优势，别因为别人的一句话就怀疑它。你只是还没找到欣赏它的人。</div>
      </div>
    </div>`;

  /* --- 赚钱方向（详细版） --- */
  const careerGroups = top3.map((d,idx) => {
    const m = DIMS[d];
    const c = CAREERS[d];
    return `
      <div class="career-group">
        <div class="career-head">
          <span class="tag" style="background:${m.color}1f;color:${m.color}">${DIMS[d].name} · ${m.tag}</span>
          <small>${idx === 0 ? '最对味的方向' : idx === 1 ? '值得试试的方向' : '可以发展的方向'} · 匹配度 ${pct[d]}%</small>
        </div>
        <div class="career-reason">${c.reason}</div>
        <div class="chips">${c.list.map(x => `<span class="chip">${x}</span>`).join('')}</div>
      </div>`;
  }).join('');

  /* --- 大实话 --- */
  const truths = [
    TALENT[t1].bigTruth,
    `你靠什么赚钱：${TALENT[t1].money}`,
    `找工作时记住一句话——${TALENT[t1].env}`,
    `和人相处时记住——${TALENT[t1].relationship}`,
    `累的时候记住——${TALENT[t1].stress}`
  ];
  const truthHTML = truths.map((x,i) => `
    <div class="truth-item">
      <span class="truth-num">${i+1}</span>
      <p>${x}</p>
    </div>`).join('');

  /* --- 发展路线图 --- */
  const roadmapHTML = `
    <div class="roadmap">
      <div class="road-item">
        <div class="road-dot">1</div>
        <div class="road-body">
          <h4>现在就能做 <small>0–3 个月</small></h4>
          <p>先别急着换赛道。从下面这些小事开始，把你的<b>${DIMS[t1].name}</b>天赋用起来：</p>
          <ul>
            <li>在工作中主动认领那些需要<b>${DIMS[t1].name}</b>能力的任务</li>
            <li>找一个能让你"用天赋"的副业或爱好，先动起来</li>
            <li>记录下你做这些事时的状态——是不是比做别的事更来劲？</li>

        </div>
      </div>
      <div class="road-item">
        <div class="road-dot">2</div>
        <div class="road-body">
          <h4>接下来半年 <small>3–12 个月</small></h4>
          <p>确认方向之后，开始<b>刻意积累</b>：</p>
          <ul>
            <li>系统学习与<b>${DIMS[t1].name}</b>相关的硬技能，别贪多，一次一个</li>

        </div>
      </div>
      <div class="road-item">
        <div class="road-dot">3</div>
        <div class="road-body">
          <h4>一年以后 <small>1–3 年</small></h4>
          <p>当你确认这条路对味，就可以<b>加注</b>了：</p>
          <ul>
            <li>把<b>${DIMS[t1].name}</b> + <b>${DIMS[t2].name}</b>的组合能力，打磨成你的个人标签</li>
            <li>在某个细分领域做到"别人一提到这个，就想到你"</li>
            <li>要么在组织里走到更重要的位置，要么用自己的能力独立接单</li>
          </ul>
        </div>
      </div>
    </div>`;

  /* --- 反思问题 --- */
  const reflectPool = {
    R:'回想一下，你上一次因为"亲手做成一件事"而特别爽，是什么时候？那种感觉，你多久没有过了？',
    I:'有没有一个问题，你其实一直很好奇，但一直没时间去搞清楚？如果给你一个月，你最想搞明白什么？',
    A:'你上一次觉得"这个东西真好看 / 真有感觉"，是什么时候？你有没有为自己留出创造的时间？',
    S:'你帮过的人里，哪一个让你觉得"值了"？你有没有因为帮别人，把自己累垮过？',
    E:'你上一次主动站出来、把一件事扛下来，是什么时候？结果怎么样？',
    C:'什么样的事情，交到你手里你最放心？你有没有因为太较真，把自己搞得很累？'
  };
  const reflectHTML = top3.map(d => `
    <div class="reflect-item">
      <span class="q">Q</span>
      <p>${reflectPool[d]}</p>
    </div>`).join('');

  /* --- 渲染 --- */
  $('screen-result').innerHTML = `
    <div class="report-header">
      <div class="rh-top">
        <span class="rh-label">TALENT REPORT</span>
        <span class="rh-meta">编号 ${reportNo} · ${dateStr}</span>
      </div>
      <h1 class="rh-code">${top3.join('')}</h1>
      <p class="rh-names">
        <span>${DIMS[t1].name}</span><i>·</i><span>${DIMS[t2].name}</span><i>·</i><span>${DIMS[t3].name}</span>
      </p>
      <p class="rh-summary">${summaryShort}${dualCore ? '两项分数接近，你是<b>双天赋驱动</b>的人。' : ''}下面这份报告，不跟你讲大道理，就用大白话告诉你：你天生擅长什么、别人为什么误解你、你适合靠什么赚钱、接下来该怎么走。</p>
    </div>

    <!-- 01 -->
    <div class="chapter">
      <span class="chapter-num">01</span>
      <span class="chapter-title">你的天赋长什么样</span>
      <span class="chapter-line"></span>
    </div>
    <div class="viz-grid">
      <div class="card">
        <h3>六维天赋雷达图</h3>
        ${radarSVG(pct)}
      </div>
      <div class="card">
        <h3>各维度得分</h3>
        ${barRows}
        <div class="score-note">
          <b>怎么看这个分：</b>分数越高，说明这方面的天赋越明显。
          80% 以上是"非常突出"，65–79% 是"比较突出"。
          重点看最高的 2–3 项就够了，它们就是你最该用的天赋。
        </div>

    <!-- 02 -->
    <div class="chapter">

      <span class="chapter-title">六个维度，逐条给你讲清楚</span>

    <!-- 04 -->
    <div class="chapter">
      <span class="chapter-num">04</span>
      <span class="chapter-title">你最值钱的 3 个天赋</span>
      <span class="chapter-line"></span>
    </div>
    ${typeCards}

    <!-- 05 -->
    <div class="chapter">
      <span class="chapter-num">05</span>
      <span class="chapter-title">你的天赋组合，到底强在哪</span>
      <span class="chapter-line"></span>
    </div>
    <div class="combo-box">
      <span class="combo-tag">${comboKey} 组合 · ${combo.title}</span>
      <h3>${DIMS[t1].name} × ${DIMS[t2].name}：${combo.title}</h3>
      <p>${combo.txt}</p>
      <p>${combo.scene}</p>
    </div>

    <!-- 06 -->
    <div class="chapter">
      <span class="chapter-num">06</span>
      <span class="chapter-title">在不同场景里，你会是什么样</span>
      <span class="chapter-line"></span>
    </div>
    ${sceneHTML}

    <!-- 07 -->
    <div class="chapter">
      <span class="chapter-num">07</span>
      <span class="chapter-title">别人眼中的你 vs 真实的你</span>
      <span class="chapter-line"></span>
    </div>
    ${mirrorHTML}

    <!-- 08 -->
    <div class="chapter">
      <span class="chapter-num">08</span>
      <span class="chapter-title">你适合靠什么赚钱</span>
      <span class="chapter-line"></span>
    </div>
    <div class="card">
      ${careerGroups}
      <div class="money-note">
        <b>一句话总结：</b>上面这些方向，不是说你只能干这些，而是说——在同样的努力下，你干这些会比其他事更顺、更省力、更容易做出成绩。选对赛道，比拼命跑更重要。
      </div>
    </div>

    <!-- 09 -->
    <div class="chapter">
      <span class="chapter-num">09</span>
      <span class="chapter-title">接下来，你可以这样走</span>
      <span class="chapter-line"></span>
    </div>
    <div class="card">
      ${roadmapHTML}
    </div>

    <!-- 10 -->
    <div class="chapter">
      <span class="chapter-num">10</span>
      <span class="chapter-title">给你的几句大实话</span>
      <span class="chapter-line"></span>
    </div>
    <div class="truth-list">${truthHTML}</div>

    <!-- 11 -->
    <div class="chapter">
      <span class="chapter-num">11</span>
      <span class="chapter-title">最后，问自己三个问题</span>
      <span class="chapter-line"></span>
    </div>
    <div class="reflect-list">${reflectHTML}</div>

    <div class="actions">
      <button class="btn-primary" onclick="startQuiz()">重新测一次</button>
    </div>
    <p class="disclaimer">
      <b>说句实在话：</b>这个测试测的是你的<strong>天赋倾向</strong>，不是你的能力上限，也不是说你只能干某类工作。
      天赋决定你"起步顺不顺"，能力决定你"能走多远"，选择决定你"走到哪"。
      这份报告基于霍兰德职业兴趣理论整理，只是一个参考——真正懂你的人，是你自己。
    </p>
  `;

  showScreen('screen-result');

  setTimeout(() => {
    document.querySelectorAll('#screen-result .bar-fill').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  }, 80);
}
